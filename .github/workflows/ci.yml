name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: npm test
      - name: Verify model artifact
        run: python -m pipeline.verify_uci_artifact --input data/public/water-treatment.data --artifact frontend/public/data/uci-model.json
      - name: Verify effluent and legal artifacts
        run: python -m pipeline.verify_effluent_v4




