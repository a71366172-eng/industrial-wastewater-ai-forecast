name: Build and optionally deploy static site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: static-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: npm test
      - name: Verify model artifact
        run: python -m pipeline.verify_uci_artifact --input data/public/water-treatment.data --artifact frontend/public/data/uci-model.json
      - name: Verify effluent and legal artifacts
        run: python -m pipeline.verify_effluent_v4
      - name: Upload private static-site artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static-site
          path: frontend
          if-no-files-found: error

  deploy-pages:
    if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
